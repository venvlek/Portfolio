<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Adebiyi Olamilekan</title>
  <meta name="description" content="Contact Adebiyi Olamilekan about development roles and freelance projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<body>
<div id="site-nav"></div>
<header class="page-head"><div class="container"><div class="pill">📬 Contact</div><h1>Let's build something</h1><p class="lede">Tell me what you need. I reply to every message.</p></div></header>
<section style="padding-top:28px"><div class="container"><div class="grid cols-2">
  <div class="card">
    <form id="contactForm" novalidate>
      <label><span class="sr-only">Name</span><input type="text" name="name" placeholder="Your name" required /></label>
      <label><span class="sr-only">Email</span><input type="email" name="email" placeholder="Your email" required /></label>
      <label><span class="sr-only">Message</span><textarea name="message" placeholder="Your message" required></textarea></label>
      <button class="btn" type="submit">Send message</button>
      <p id="formStatus" class="muted" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="card">
    <h3>Elsewhere</h3>

      <li>💼 <a href="https://www.linkedin.com/in/adebiyi-olamilekan-4b083027a/" target="_blank" rel="noopener">linkedin.com/in/adebiyi-olamilekan</a></li>
      <li>🐙 <a href="https://github.com/venvlek" target="_blank" rel="noopener">github.com/venvlek</a></li>
